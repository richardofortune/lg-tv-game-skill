* { box-sizing: border-box; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

#stage {
  position: absolute; z-index: 1; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0;
  display: grid; grid-template-columns: 740px 1fr; column-gap: 90px;
  padding: 56px 120px 50px;
  font-family: "Baloo", "LG Smart UI", "Arial Rounded MT Bold", Arial, sans-serif;
  color: var(--ink);
}
#stage > section { position: relative; z-index: 1; }

/* Scenery, anchored to the screen corners and scaled with the stage */
#scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.corner { position: absolute; transform: scale(var(--s, 1)); }
.corner.bl { left: 0; bottom: 0; width: 1000px; height: 500px; transform-origin: 0 100%; }
.corner.br { right: 0; bottom: 0; width: 900px; height: 900px; transform-origin: 100% 100%; }
.corner.tr { right: 0; top: 0; width: 500px; height: 300px; transform-origin: 100% 0; }
.decor { position: absolute; pointer-events: none; }
.cl-bl { left: -250px; bottom: -90px; width: 460px; height: 330px; }
.cl-br { right: -70px; bottom: -40px; width: 640px; height: 360px; }
.cl-tr { right: -40px; top: -30px; width: 460px; height: 240px; }
.kelpb { transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite alternate; }
.kb1 { right: 0; bottom: 110px; width: 150px; height: 720px; }
.kb2 { right: -60px; bottom: 80px; width: 120px; height: 560px; animation-duration: 8.6s; animation-delay: -3s; }
.shells1 { left: 780px; bottom: 34px; width: 140px; height: 90px; }
.fishlane { position: absolute; left: 0; right: 0; bottom: calc(190px * var(--s, 1)); height: 80px; }
.fish { position: absolute; left: 0; top: 0; width: calc(110px * var(--s, 1)); height: calc(55px * var(--s, 1)); animation: swim 38s linear infinite; animation-delay: -6s; }
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes swim {
  0% { transform: translate(-20vw, 0); }
  15% { transform: translate(22vw, -2vh); }
  30% { transform: translate(54vw, 1vh); }
  45% { transform: translate(86vw, -1.5vh); }
  55%, 100% { transform: translate(115vw, 0); }
}

/* Driftwood sign */
.title { margin: 0 0 0 -14px; width: 470px; height: 170px; }
.title svg { width: 100%; height: 100%; overflow: visible; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tagline { margin: 10px 0 26px; font-size: 31px; color: var(--foam); font-weight: 600; text-shadow: 0 2px 6px rgba(5, 40, 50, .7); }

/* Board: hollows in the sand that fill with pebbles */
.pool { position: relative; width: 578px; }
#board { display: grid; grid-template-rows: repeat(6, 106px); row-gap: 12px; }
.row { display: grid; grid-template-columns: repeat(5, 106px); column-gap: 12px; }
.tile {
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; padding-top: 8px;
  border-radius: 48% 52% 45% 55% / 52% 46% 54% 48%;
  background: radial-gradient(ellipse at 50% 42%, rgba(4, 44, 54, .28), rgba(4, 44, 54, .44));
  box-shadow: inset 0 7px 12px rgba(0, 25, 32, .5), inset 0 -2px 0 rgba(255, 255, 255, .16);
  font-size: 66px; font-weight: 800; text-transform: uppercase; color: var(--deep-ink);
  transition: transform .16s ease-in;
}
.tile:nth-child(2) { border-radius: 55% 45% 52% 48% / 46% 54% 46% 54%; }
.tile:nth-child(3) { border-radius: 46% 54% 50% 50% / 55% 48% 52% 45%; }
.tile:nth-child(4) { border-radius: 52% 48% 56% 44% / 48% 52% 48% 52%; }
.tile:nth-child(5) { border-radius: 50% 50% 44% 56% / 53% 47% 55% 45%; }
.tile.filled, .tile[data-s] {
  box-shadow: 0 8px 0 rgba(0, 32, 40, .38), 0 12px 18px rgba(0, 32, 40, .35), inset 0 -9px 14px rgba(90, 70, 40, .32);
}
.tile.filled { background: var(--gloss), var(--speck), radial-gradient(circle at 50% 42%, #F6EFE0, #D9CCB0 88%); }
.tile[data-s="correct"] {
  background: var(--gloss), var(--paua);
  color: #fff; text-shadow: 0 3px 0 rgba(0, 35, 60, .5);
  box-shadow: 0 8px 0 rgba(0, 32, 40, .4), 0 12px 18px rgba(0, 32, 40, .35), inset 0 0 0 4px rgba(200, 255, 245, .35), inset 0 -10px 16px rgba(10, 30, 70, .45);
}
.tile[data-s="correct"]::after {
  content: ""; position: absolute; inset: -20%; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .5) 50%, transparent 65%);
  animation: shimmer 4.5s ease-in-out infinite; will-change: transform;
}
.tile[data-s="present"] { background: var(--gloss), var(--speck), radial-gradient(circle at 50% 40%, #FFDC8A, #E8A335 90%); color: var(--gold-ink); }
.tile[data-s="absent"] { background: var(--gloss), var(--speck-light), radial-gradient(circle at 50% 40%, #56615F, #2B3333 90%); color: var(--basalt-ink); }
.tile[data-s="absent"] { box-shadow: 0 6px 0 rgba(0, 32, 40, .4), inset 0 -8px 12px rgba(0, 0, 0, .35); }
@keyframes shimmer { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.tile.pop { animation: pop .12s ease-out; }
.row.shake { animation: shake .4s; }
.tile.bounce { animation: bounce .5s ease-out both; }
@keyframes pop { 50% { transform: scale(1.12); } }
@keyframes shake { 20%,60% { transform: translateX(-14px); } 40%,80% { transform: translateX(14px); } }
@keyframes bounce { 40% { transform: translateY(-30px); } 70% { transform: translateY(6px); } }

/* Wheke */
#wheke { position: absolute; left: calc(100% + 8px); top: -44px; width: 220px; height: 270px; }
#wheke .clip { position: absolute; inset: 0; overflow: hidden; }
#wheke .octo { position: absolute; left: 10px; top: 0; width: 200px; height: 200px; transition: transform .35s cubic-bezier(.3, 1.4, .5, 1); }
#wheke .bob { animation: bob 3.2s ease-in-out infinite; }
#wheke .rock { position: absolute; left: 0; bottom: 0; width: 220px; height: 130px; }
#wheke .arm { position: absolute; left: 118px; top: 128px; width: 90px; height: 110px; transition: opacity .2s, transform .35s; transform-origin: 20% 0; animation: curl 4s ease-in-out infinite; }
#wheke .lids rect { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: blink 5s infinite; }
#wheke .frown { display: none; }
#wheke.peek .octo { transform: translateY(-14px); }
#wheke.duck .octo { transform: translateY(210px); transition-duration: .2s; }
#wheke.duck .arm, #wheke.sad .arm { opacity: 0; }
#wheke.happy .octo { animation: hop .6s ease-out 3; }
#wheke.sad .octo { transform: translateY(50px); }
#wheke.sad .smile { display: none; }
#wheke.sad .frown { display: inline; }
@keyframes bob { 50% { transform: translateY(6px); } }
@keyframes curl { 50% { transform: rotate(-6deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }
@keyframes hop { 40% { transform: translateY(-40px) rotate(-6deg); } 70% { transform: translateY(0) rotate(4deg); } }
.bubble {
  position: absolute; z-index: 3; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, .9) 0 12%, rgba(255, 255, 255, .12) 30%, rgba(255, 255, 255, .05) 60%, rgba(255, 255, 255, .5) 100%);
  animation: rise 2.4s ease-in forwards;
}
@keyframes rise { to { transform: translate(var(--dx), -620px); opacity: 0; } }

/* Keyboard of shells */
.right { display: flex; flex-direction: column; justify-content: center; padding-bottom: 110px; }
#keyboard { display: flex; flex-direction: column; gap: 14px; }
.krow { display: flex; gap: 10px; }
.krow.mid { padding-left: 43px; }
.key {
  position: relative;
  width: 76px; height: 106px; color: var(--deep-ink);
  border-radius: 46% 46% 18px 18px / 30% 30% 18px 18px;
  background:
    radial-gradient(ellipse 40% 22% at 50% 16%, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0) 70%),
    repeating-linear-gradient(90deg, rgba(170, 130, 95, 0) 0 5px, rgba(170, 130, 95, .1) 5px 7px, rgba(170, 130, 95, 0) 7px 13px),
    linear-gradient(#FFF8EA, #EBDCC0);
  box-shadow: 0 6px 0 #B89F7E, 0 10px 14px rgba(0, 32, 40, .35);
  font-size: 44px; font-weight: 700; text-transform: uppercase; padding-top: 10px;
  transition: transform .08s, filter .15s;
}
.key.wide { width: 124px; font-size: 29px; text-transform: none; }
.key[data-s="correct"] { background: var(--gloss), var(--paua); color: #fff; text-shadow: 0 2px 0 rgba(0, 35, 60, .5); box-shadow: 0 6px 0 #145A6E, 0 10px 14px rgba(0, 32, 40, .35); }
.key[data-s="present"] { background: var(--gloss), var(--speck), radial-gradient(circle at 50% 35%, #FFDC8A, #E8A335 95%); color: var(--gold-ink); box-shadow: 0 6px 0 #A8741E, 0 10px 14px rgba(0, 32, 40, .35); }
.key[data-s="absent"] { background: var(--speck-light), linear-gradient(#4A5452, #2E3636); color: #7D918E; box-shadow: 0 4px 0 #1E2626; }

.nav:focus { outline: 6px solid #FFE27A; outline-offset: 5px; transform: scale(1.08) translateY(-4px); position: relative; z-index: 2; }
.key:focus:not([data-s]) { filter: brightness(1.08); }

.hints { display: flex; gap: 40px; margin-top: 48px; font-size: 27px; color: var(--foam); align-items: center; flex-wrap: wrap; row-gap: 18px; font-weight: 600; text-shadow: 0 2px 6px rgba(5, 40, 50, .7); }
.hint { display: flex; align-items: center; gap: 14px; }
.dot { width: 24px; height: 24px; border-radius: 50%; display: inline-block; box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.dot.red { background: #E0463A; } .dot.green { background: #3DB25A; }
.mini { width: 42px; height: 42px; border-radius: 48% 52% 45% 55% / 52% 46% 54% 48%; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; padding-top: 3px; text-shadow: none; box-shadow: 0 3px 0 rgba(0, 32, 40, .4); }
.mini.c { background: var(--gloss), var(--paua); color: #fff; }
.mini.p { background: var(--gloss), radial-gradient(circle at 50% 40%, #FFDC8A, #E8A335 90%); color: var(--gold-ink); }
.mini.a { background: radial-gradient(circle at 50% 40%, #56615F, #2B3333 90%); color: var(--basalt-ink); }
.legend { margin-top: 22px; }

#toast {
  position: absolute; z-index: 5; left: 50%; top: 40px; transform: translateX(-50%);
  background: #FFF8EA; color: var(--deep-ink); font-size: 34px; font-weight: 700;
  padding: 16px 38px 12px; border-radius: 40px; opacity: 0; transition: opacity .2s; pointer-events: none;
  box-shadow: 0 6px 0 #B89F7E, 0 10px 20px rgba(0, 32, 40, .4);
}
#toast.show { opacity: 1; }

/* Dialogs on a slab of wet sand */
.scrim { position: absolute; inset: -1200px; z-index: 10; background: rgba(6, 36, 44, .7); display: flex; align-items: center; justify-content: center; }
.scrim[hidden] { display: none; }
.dialog {
  position: relative; color: var(--deep-ink); width: 860px; padding: 56px 72px 60px;
  border-radius: 42px 50px 40px 46px / 46px 40px 50px 42px;
  background: var(--speck), radial-gradient(ellipse at 40% 30%, #FBF1DE, #E7D5B2 95%);
  box-shadow: 0 12px 0 #B89F7E, 0 24px 40px rgba(0, 20, 28, .5);
}
.dialog .deco { position: absolute; right: -34px; top: -40px; width: 150px; height: 120px; pointer-events: none; }
.dialog h2 { margin: 0 0 8px; font-size: 72px; font-weight: 800; line-height: 1; }
.dialog .sub { margin: 0 0 36px; font-size: 32px; color: #4A6B70; font-weight: 500; }
.answer { color: #A8661A; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.stats { display: flex; gap: 56px; margin-bottom: 36px; }
.stat b { display: block; font-size: 66px; font-weight: 800; line-height: 1; }
.stat span { font-size: 25px; color: #4A6B70; font-weight: 500; }
#dist { display: grid; gap: 10px; margin-bottom: 44px; }
.drow { display: flex; align-items: center; gap: 16px; font-size: 27px; font-weight: 700; }
.drow i { font-style: normal; width: 20px; color: #4A6B70; }
.bar { background: rgba(160, 130, 90, .28); min-width: 52px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: flex-end; padding: 4px 16px 0; }
.bar.now { background: linear-gradient(#FFD57A, #E8A335); color: var(--gold-ink); }
.btns { display: flex; gap: 20px; }
.btns.stack { flex-direction: column; }
.btn { height: 92px; padding: 6px 46px 0; border-radius: 46px; background: rgba(160, 130, 90, .3); color: var(--deep-ink); font-size: 36px; font-weight: 700; text-align: left; }
.btn.primary { background: linear-gradient(#FF9C84, #EE7358); color: #3B120A; box-shadow: 0 6px 0 #B9533E; }
.dialog .nav:focus { outline-color: var(--deep-ink); }
.btn:focus { transform: scale(1.03); }
.menu-legend { display: grid; gap: 16px; margin: 0 0 40px; font-size: 30px; color: #3C5F64; font-weight: 500; }
.menu-legend div { display: flex; gap: 18px; align-items: center; }
.menu-legend .mini { width: 56px; height: 56px; font-size: 30px; }

/* Portrait layout for phones */
#stage.portrait {
  width: 1080px; height: 1920px; grid-template-columns: 1fr; grid-template-rows: auto auto;
  column-gap: 0; row-gap: 50px; padding: 140px 60px 80px; justify-items: center; align-content: center;
}
#stage.portrait .right { align-items: center; padding-bottom: 0; }
#stage.portrait #wheke { transform: scale(.85); transform-origin: 0 0; }
.portrait-mode .kb1 { display: none; }
.portrait-mode .kb2 { right: -30px; bottom: 70px; height: 420px; }
.portrait-mode .shells1 { left: 460px; bottom: 40px; }
.touch .nav:focus { outline: none; transform: none; }
.touch .key:focus:not([data-s]) { filter: none; }
.touch .tv-only { display: none; }
#menuBtn { display: none; position: absolute; z-index: 4; right: 60px; top: 56px; height: 84px; padding: 6px 36px 0; border-radius: 42px; color: var(--deep-ink); font-size: 32px; font-weight: 700;
  background: linear-gradient(#FFF8EA, #EBDCC0); box-shadow: 0 6px 0 #B89F7E, 0 10px 14px rgba(0, 32, 40, .35); }
.touch #menuBtn { display: block; }
.web .quit { display: none; }

@media (prefers-reduced-motion: reduce) {
  .tile, .key, #wheke .octo { transition: none; }
  .tile.pop, .row.shake, .tile.bounce, .kelpb, .fish, #wheke .bob, #wheke .arm, #wheke.happy .octo, .tile[data-s="correct"]::after, .bubble { animation: none; }
  .fish { display: none; }
}

<script>
(function () {
  "use strict";

  // ---------- Words ----------
  function unpack(s) { var out = []; for (var i = 0; i < s.length; i += 5) out.push(s.substr(i, 5)); return out; }
  var ANSWERS = unpack(KUPU_ANSWERS);
  var VALID = new Set(unpack(KUPU_VALID));

  // ---------- Storage (guarded, TV storage can fail) ----------
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- Keys ----------
  var K = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, OK: 13, BACKSPACE: 8, ESC: 27,
            BACK: 461, RED: 403, GREEN: 404, YELLOW: 405, BLUE: 406 };

  // ---------- State ----------
  var S = { answer: "", guesses: [], cur: "", over: false, won: false, busy: false };
  var typedSinceNav = false;

  var $ = function (s) { return document.querySelector(s); };
  var board = $("#board"), keyboard = $("#keyboard");

  // ---------- Wheke reactions ----------
  var wk = $("#wheke"), wkTimer;
  function wheke(mood, ms) {
    clearTimeout(wkTimer);
    wk.classList.remove("peek", "duck", "happy", "sad");
    if (!mood) return;
    void wk.offsetWidth;
    wk.classList.add(mood);
    if (ms) wkTimer = setTimeout(function () { wk.classList.remove(mood); }, ms);
  }
  function bubbles() {
    var pool = $(".pool");
    for (var i = 0; i < 14; i++) {
      var b = document.createElement("div"), size = 14 + Math.random() * 30;
      b.className = "bubble";
      b.style.width = b.style.height = size + "px";
      b.style.left = (620 + Math.random() * 130) + "px";
      b.style.top = (30 + Math.random() * 80) + "px";
      b.style.setProperty("--dx", ((Math.random() - .5) * 160) + "px");
      b.style.animationDelay = (i * 90) + "ms";
      pool.appendChild(b);
      setTimeout(function (el) { el.remove(); }, 3800, b);
    }
  }

  // ---------- Build board and keyboard ----------
  for (var r = 0; r < 6; r++) {
    var row = document.createElement("div"); row.className = "row";
    for (var c = 0; c < 5; c++) { var t = document.createElement("div"); t.className = "tile"; row.appendChild(t); }
    board.appendChild(row);
  }
  var LAYOUT = ["qwertyuiop", "asdfghjkl", "+zxcvbnm-"];
  LAYOUT.forEach(function (line, i) {
    var kr = document.createElement("div"); kr.className = "krow" + (i === 1 ? " mid" : "");
    line.split("").forEach(function (ch) {
      var b = document.createElement("button"); b.className = "key nav";
      if (ch === "+") { b.textContent = "Enter"; b.classList.add("wide"); b.dataset.k = "enter"; }
      else if (ch === "-") { b.textContent = "Delete"; b.classList.add("wide"); b.dataset.k = "del"; }
      else { b.textContent = ch; b.dataset.k = ch; }
      kr.appendChild(b);
    });
    keyboard.appendChild(kr);
  });
  function keyEl(ch) { return keyboard.querySelector('[data-k="' + ch + '"]'); }

  // ---------- Scale 1920x1080 stage to the screen ----------
  var isTV = /Web0S|webOS/i.test(navigator.userAgent);
  if (!isTV) document.body.classList.add("web");
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, st = $("#stage");
    var portrait = h > w;
    st.classList.toggle("portrait", portrait);
    var sw = portrait ? 1080 : 1920, sh = portrait ? 1920 : 1080;
    var s = Math.min(w / sw, h / sh);
    st.style.transform = "translate(" + (w - sw * s) / 2 + "px," + (h - sh * s) / 2 + "px) scale(" + s + ")";
    document.documentElement.style.setProperty("--s", s);
    document.body.classList.toggle("portrait-mode", portrait);
  }
  window.addEventListener("resize", fit); fit();

  // ---------- Rendering ----------
  function tile(r, c) { return board.children[r].children[c]; }
  function renderRow(r, word, states) {
    for (var c = 0; c < 5; c++) {
      var t = tile(r, c), ch = word[c] || "";
      t.textContent = ch;
      t.classList.toggle("filled", !!ch);
      if (states) t.dataset.s = states[c]; else delete t.dataset.s;
    }
  }
  function clearBoard() {
    for (var r = 0; r < 6; r++) {
      board.children[r].classList.remove("shake");
      for (var c = 0; c < 5; c++) { var t = tile(r, c); t.className = "tile"; t.textContent = ""; delete t.dataset.s; }
    }
    keyboard.querySelectorAll(".key").forEach(function (k) { delete k.dataset.s; });
  }
  var RANK = { absent: 1, present: 2, correct: 3 };
  function paintKeys(word, states) {
    for (var i = 0; i < 5; i++) {
      var k = keyEl(word[i]); if (!k) continue;
      var old = k.dataset.s;
      if (!old || RANK[states[i]] > RANK[old]) k.dataset.s = states[i];
    }
  }

  var toastTimer;
  function toast(msg, ms) {
    var el = $("#toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, ms || 1600);
  }

  // ---------- Game logic ----------
  function evaluate(guess, answer) {
    var res = ["absent", "absent", "absent", "absent", "absent"], left = {};
    for (var i = 0; i < 5; i++) {
      if (guess[i] === answer[i]) res[i] = "correct";
      else left[answer[i]] = (left[answer[i]] || 0) + 1;
    }
    for (i = 0; i < 5; i++) {
      if (res[i] !== "correct" && left[guess[i]] > 0) { res[i] = "present"; left[guess[i]]--; }
    }
    return res;
  }

  function pickAnswer() {
    var recent = store.get("kupu-recent", []);
    var pool = ANSWERS.filter(function (w) { return recent.indexOf(w) < 0; });
    if (!pool.length) pool = ANSWERS;
    var w = pool[Math.floor(Math.random() * pool.length)];
    recent.push(w); if (recent.length > 300) recent = recent.slice(-300);
    store.set("kupu-recent", recent);
    return w;
  }

  function save() { store.set("kupu-game", { answer: S.answer, guesses: S.guesses, over: S.over }); }

  function newGame() {
    S.answer = pickAnswer(); S.guesses = []; S.cur = ""; S.over = false; S.won = false; S.busy = false;
    clearBoard(); save(); wheke(null);
  }

  function restore() {
    var g = store.get("kupu-game", null);
    if (!g || g.over || !g.answer || !Array.isArray(g.guesses)) return false;
    S.answer = g.answer; S.guesses = g.guesses.slice(0, 5); S.cur = ""; S.over = false;
    clearBoard();
    S.guesses.forEach(function (w, r) { var st = evaluate(w, S.answer); renderRow(r, w, st); paintKeys(w, st); });
    return true;
  }

  function type(ch) {
    if (S.over || S.busy || S.cur.length >= 5) return;
    S.cur += ch;
    var t = tile(S.guesses.length, S.cur.length - 1);
    renderRow(S.guesses.length, S.cur);
    t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
    wheke("peek", 180);
  }
  function del() {
    if (S.over || S.busy || !S.cur) return;
    S.cur = S.cur.slice(0, -1); renderRow(S.guesses.length, S.cur);
  }
  function shake() {
    var row = board.children[S.guesses.length];
    row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");
  }

  function submit() {
    if (S.over || S.busy) return;
    if (S.cur.length < 5) { shake(); wheke("duck", 1100); toast("Five letters needed"); return; }
    if (!VALID.has(S.cur)) { shake(); wheke("duck", 1100); toast("Not in the word list"); return; }
    var word = S.cur, r = S.guesses.length, states = evaluate(word, S.answer);
    S.busy = true; S.cur = "";
    S.guesses.push(word);
    S.won = word === S.answer;
    S.over = S.won || S.guesses.length === 6;
    save();

    // Flip each tile: rotate to edge, swap colour, rotate back.
    states.forEach(function (st, c) {
      var t = tile(r, c);
      setTimeout(function () {
        t.style.transform = "rotateX(90deg)";
        setTimeout(function () { t.dataset.s = st; t.style.transform = ""; }, 170);
      }, c * 260);
    });
    setTimeout(function () {
      paintKeys(word, states);
      S.busy = false;
      if (S.over) finish();
    }, 5 * 260 + 200);
  }

  function finish() {
    var stats = store.get("kupu-stats", { played: 0, wins: 0, streak: 0, best: 0, dist: [0, 0, 0, 0, 0, 0] });
    stats.played++;
    if (S.won) {
      stats.wins++; stats.streak++; stats.best = Math.max(stats.best, stats.streak);
      stats.dist[S.guesses.length - 1]++;
    } else stats.streak = 0;
    store.set("kupu-stats", stats);

    var delay = 900;
    if (S.won) {
      var r = S.guesses.length - 1;
      for (var c = 0; c < 5; c++) { var t = tile(r, c); t.style.animationDelay = (c * 90) + "ms"; t.classList.add("bounce"); }
      var praise = ["Genius", "Brilliant", "Sharp", "Nice one", "Phew", "Just in time"];
      toast(praise[r], 1400);
      wheke("happy", 1900); bubbles();
      delay = 1600;
    } else {
      toast(S.answer.toUpperCase(), 2200);
      wheke("sad");
      delay = 1800;
    }
    setTimeout(function () { showEnd(stats); }, delay);
  }

  function showEnd(stats) {
    $("#endTitle").textContent = S.won ? "Got it in " + S.guesses.length : "Out of tries";
    $("#endSub").innerHTML = "The word was <span class='answer'>" + S.answer + "</span>";
    var pct = stats.played ? Math.round(stats.wins / stats.played * 100) : 0;
    $("#stats").innerHTML = [
      [stats.played, "Played"], [pct + "%", "Won"], [stats.streak, "Streak"], [stats.best, "Best streak"]
    ].map(function (s) { return "<div class='stat'><b>" + s[0] + "</b><span>" + s[1] + "</span></div>"; }).join("");
    var max = Math.max.apply(null, stats.dist.concat([1]));
    $("#dist").innerHTML = stats.dist.map(function (n, i) {
      var now = S.won && i === S.guesses.length - 1 ? " now" : "";
      return "<div class='drow'><i>" + (i + 1) + "</i><div class='bar" + now + "' style='width:" + (52 + n / max * 600) + "px'>" + n + "</div></div>";
    }).join("");
    openDialog("end");
  }

  // ---------- Dialogs ----------
  var openId = null, lastKeyFocus = null;
  function openDialog(id) {
    if (openId) $("#" + openId).hidden = true;
    else if (keyboard.contains(document.activeElement)) lastKeyFocus = document.activeElement;
    if (id === "menu") $("#skipBtn").textContent = S.over ? "New word" : "Skip this word";
    openId = id; $("#" + id).hidden = false;
    focusEl($("#" + id + " .nav"));
  }
  function closeDialog() {
    if (!openId) return;
    $("#" + openId).hidden = true; openId = null;
    focusEl(lastKeyFocus || keyEl("g"));
  }
  function scope() { return openId ? $("#" + openId) : keyboard; }

  function quit() {
    try { if (window.webOS && webOS.platformBack) { webOS.platformBack(); return; } } catch (e) {}
    window.close();
  }

  function act(name) {
    if (name === "next") { closeDialog(); newGame(); }
    else if (name === "resume") { closeDialog(); if (S.over) showEnd(store.get("kupu-stats")); }
    else if (name === "skip") {
      if (!S.over && S.guesses.length) {
        var st = store.get("kupu-stats", null); if (st) { st.played++; st.streak = 0; store.set("kupu-stats", st); }
        toast("The word was " + S.answer.toUpperCase(), 2200);
      }
      closeDialog(); newGame();
    }
    else if (name === "quit") quit();
  }

  // ---------- Spatial navigation ----------
  function focusEl(el) { if (el) el.focus({ preventScroll: true }); }
  function centre(el) { var b = el.getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2 }; }
  function move(dir) {
    typedSinceNav = false;
    var items = Array.prototype.slice.call(scope().querySelectorAll(".nav"));
    var cur = document.activeElement;
    if (items.indexOf(cur) < 0) { focusEl(items[0]); return; }
    var a = centre(cur), best = null, bestScore = Infinity;
    items.forEach(function (el) {
      if (el === cur) return;
      var b = centre(el), dx = b.x - a.x, dy = b.y - a.y, main, side;
      if (dir === "left")  { if (dx > -5) return; main = -dx; side = Math.abs(dy); }
      if (dir === "right") { if (dx < 5)  return; main = dx;  side = Math.abs(dy); }
      if (dir === "up")    { if (dy > -5) return; main = -dy; side = Math.abs(dx); }
      if (dir === "down")  { if (dy < 5)  return; main = dy;  side = Math.abs(dx); }
      var score = main + side * 3;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) focusEl(best);
  }

  function activate(el) {
    if (!el) return;
    if (el.dataset.act) { act(el.dataset.act); return; }
    var k = el.dataset.k;
    if (k === "enter") submit(); else if (k === "del") del(); else if (k) type(k);
  }

  function back() {
    if (openId === "menu") act("resume");
    else openDialog("menu");
  }

  // ---------- Remote and keyboard input ----------
  document.addEventListener("keydown", function (e) {
    var code = e.keyCode, handled = true;
    if (code === K.BACK || code === K.ESC) back();
    else if (code === K.LEFT) move("left");
    else if (code === K.RIGHT) move("right");
    else if (code === K.UP) move("up");
    else if (code === K.DOWN) move("down");
    else if (code === K.OK) {
      // A physical keyboard's Enter submits; the remote's OK presses the focused key.
      if (!openId && typedSinceNav) submit(); else activate(document.activeElement);
    }
    else if (openId) handled = false;
    else if (code === K.RED || code === K.BACKSPACE) del();
    else if (code === K.GREEN) submit();
    else if (code >= 65 && code <= 90) { typedSinceNav = true; type(String.fromCharCode(code + 32)); }
    else handled = false;
    if (handled) e.preventDefault();
  });

  // Magic Remote pointer: hovering focuses, clicking presses.
  document.addEventListener("mouseover", function (e) {
    var el = e.target.closest && e.target.closest(".nav");
    if (el && scope().contains(el)) focusEl(el);
  });
  document.addEventListener("touchstart", function () { document.body.classList.add("touch"); }, { passive: true });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("click", function (e) {
    if (e.target.id === "menuBtn") { if (openId !== "menu") openDialog("menu"); return; }
    var el = e.target.closest && e.target.closest(".nav");
    if (el && scope().contains(el)) { typedSinceNav = false; activate(el); }
  });

  // ---------- Gamepad ----------
  var prev = {}, held = {}, REPEAT_START = 380, REPEAT_EVERY = 110;
  function padPoll(ts) {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i]; if (!p) continue;
      var btn = function (n) { return p.buttons[n] && p.buttons[n].pressed; };
      var ax = p.axes || [0, 0];
      var dirs = {
        up: btn(12) || ax[1] < -0.5, down: btn(13) || ax[1] > 0.5,
        left: btn(14) || ax[0] < -0.5, right: btn(15) || ax[0] > 0.5
      };
      Object.keys(dirs).forEach(function (d) {
        var id = i + d;
        if (dirs[d]) {
          if (!held[id]) { held[id] = ts + REPEAT_START; move(d); }
          else if (ts >= held[id]) { held[id] = ts + REPEAT_EVERY; move(d); }
        } else held[id] = 0;
      });
      var map = { 0: "a", 1: "b", 2: "x", 8: "select", 9: "start" };
      Object.keys(map).forEach(function (n) {
        var id = i + ":" + n, down = btn(+n);
        if (down && !prev[id]) {
          var m = map[n];
          if (m === "a") activate(document.activeElement);
          else if (m === "b") { if (openId) back(); else del(); }
          else if (m === "x") { if (!openId) del(); }
          else if (m === "start") { if (openId) activate(document.activeElement); else submit(); }
          else if (m === "select") back();
        }
        prev[id] = down;
      });
    }
    requestAnimationFrame(padPoll);
  }
  requestAnimationFrame(padPoll);

  // ---------- Start ----------
  if (!restore()) newGame();
  focusEl(keyEl("g"));
})();
</script>
</body>
</html>
